<div class="search-modal" id="searchModal" role="dialog" aria-modal="true" aria-labelledby="searchTitle" aria-hidden="true">
  <div class="search-box" role="document">
    <div class="search-box-header">
      <h2 id="searchTitle">Поиск по сайту</h2>
      <button type="button" class="search-close" id="searchClose" aria-label="Закрыть поиск">
        <svg viewBox="0 0 18 18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M4 4l10 10M14 4L4 14"/>
        </svg>
      </button>
    </div>
    <form id="searchForm" role="search">
      <label class="visually-hidden" for="searchInput">Найти оборудование, раздел или контакт</label>
      <div class="search-field">
        <svg class="search-field-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/>
          <path d="M20 20l-3.5-3.5" stroke-linecap="round"/>
        </svg>
        <input type="search" id="searchInput" placeholder="Насос, отопление, контакты…" autocomplete="off" enterkeyhint="search" role="combobox" aria-autocomplete="list" aria-expanded="true" aria-controls="searchResults" />
        <button type="button" class="search-clear" id="searchClear" aria-label="Очистить запрос">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M3 3l8 8M11 3L3 11"/>
          </svg>
        </button>
      </div>
    </form>
    <div class="search-hints" id="searchHints"></div>
    <div id="searchLive" class="visually-hidden" aria-live="polite"></div>
    <div class="search-results" id="searchResults" role="listbox" aria-label="Результаты поиска"></div>
    <div class="search-footer">
      <span><kbd>↑</kbd> <kbd>↓</kbd> выбрать · <kbd>Enter</kbd> открыть</span>
      <span><kbd>Esc</kbd> закрыть</span>
    </div>
  </div>
</div>
